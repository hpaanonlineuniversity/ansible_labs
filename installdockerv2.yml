- name: Simple Docker dry-run test
  hosts: docker_hosts
  become: true

  tasks:
    - name: Run curl and dry-run in one command
      shell: |
        curl -fsSL https://get.docker.com -o /home/student/get-docker.sh && \
        chmod +x /home/student/get-docker.sh && \
        sudo sh /home/student/get-docker.sh
      register: result

    - name: Show result
      debug:
        msg: "{{ result.stdout }}"

    - name: Add student user to docker group
      user:
        name: student
        groups: docker
        append: yes

    - name: Reboot host
      reboot:
        msg: "Rebooting to apply docker group changes"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami

    - name: Wait for system to come back online
      wait_for_connection:
        delay: 10
        timeout: 300

    - name: Clean up
      file:
        path: /home/student/get-docker.sh
        state: absent